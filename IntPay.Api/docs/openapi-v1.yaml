openapi: 3.0.3
info:
  title: IntPay API
  version: 1.0.0
  description: |
    OpenAPI documentation for IntPay API v1.

    The current implementation uses explicit caller identifiers (`userId`, `profileId`, or `actingUserId`) as a temporary request-level authorization boundary. JWT/session authentication is not enforced by the API yet.

    In the current MVP, authorized card GET responses may include the full card PAN (`cardNumber`) and CVV (`cvv`) for demo flows. Production deployments should re-enable masking, secret handling, and real authentication.

    `useTimes` is optional when creating an intent. If the client omits it or sends `null`, the API treats the intent as unlimited. The current numeric sentinel for unlimited usage is `99999`; API consumers should display this as `unlimited`.

    In Development, `MapOpenApi()` still exposes generated JSON (e.g. `/openapi/v1.json`). Scalar is configured to load this hand-maintained YAML from `/openapi/intpay-v1.yaml` (same contents as `docs/openapi-v1.yaml` on disk) so examples and long descriptions appear in the UI. Keep this file aligned with `Endpoints/V1` when behavior changes.
servers:
  - url: /api/v1
    description: API v1 relative server
tags:
  - name: Profiles
    description: Profile, wallet, and public profile discovery endpoints.
  - name: Home
    description: Home dashboard summary endpoints.
  - name: Intents
    description: Intent creation, retrieval, and metadata update endpoints.
  - name: Cards
    description: Virtual card retrieval, audit logs, and manual freeze controls.
  - name: Users
    description: User-level metrics, activity feeds, transactions, and receiver logs.
  - name: Verification
    description: Invoice verification endpoints.
  - name: Simulation
    description: Payment simulation endpoints.

paths:
  /profiles/{id}:
    get:
      tags: [Profiles]
      summary: Get profile details
      description: Returns a profile, computed locked money, contacts, profile link, and mock points.
      operationId: getProfileFullResponse
      parameters:
        - $ref: '#/components/parameters/ProfileIdPath'
      responses:
        '200':
          description: Profile fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileFullEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Profile fetched successfully.
                    data:
                      id: 1
                      name: Mohammed Fares
                      username: mohammed
                      email: mohammed@example.com
                      vaultBalance: 12000.0
                      lockMoney: 2500.0
                      link: https://intentpay.app/u/1
                      contacts:
                        - id: 2
                          name: Aisha Saleh
                          email: aisha@example.com
                          username: aisha
                          link: https://intentpay.app/u/2
                      points: 11
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profiles/{userId}/add-funds:
    post:
      tags: [Profiles]
      summary: Add funds to a profile vault
      description: Credits a user's `vault_balance` and writes a wallet credit audit event.
      operationId: addFunds
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFundsRequest'
            examples:
              addFunds:
                value:
                  amount: 500.0
      responses:
        '200':
          description: Funds added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileBalanceEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Funds added successfully.
                    data:
                      id: 1
                      name: Mohammed Fares
                      username: mohammed
                      email: mohammed@example.com
                      vaultBalance: 12500.0
                      lockMoney: 2500.0
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profiles/search:
    get:
      tags: [Profiles]
      summary: Search profiles by name
      description: Performs a case-insensitive profile name search and returns limited public profile discovery fields.
      operationId: searchProfilesByName
      parameters:
        - name: name
          in: query
          required: true
          description: Case-insensitive profile name search term. Must not be empty.
          schema:
            type: string
          example: Mohammed
      responses:
        '200':
          description: Matching profiles returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSearchEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Found 1 profile(s) matching 'Mohammed'.
                    data:
                      - id: 1
                        name: Mohammed Fares
                        username: mohammed
                        email: mohammed@example.com
                        link: https://intentpay.app/u/1
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /home/summary/{user_id}:
    get:
      tags: [Home]
      summary: Get home summary
      description: Returns available money, locked money, activity count, and categorized card sections for a user.
      operationId: getHomeSummary
      parameters:
        - name: user_id
          in: path
          required: true
          description: User profile id.
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 1
      responses:
        '200':
          description: Home summary fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSummaryEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Home summary fetched successfully.
                    data:
                      freeMoney: 9500.0
                      lockMoney: 2500.0
                      totalActivityCount: 12
                      selfCards:
                        items: []
                        count: 0
                      receivedCards:
                        items: []
                        count: 0
                      sentCards:
                        items: []
                        count: 0
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /intents/create:
    post:
      tags: [Intents]
      summary: Create intent with virtual card
      description: Creates an intent and a linked virtual card through the database RPC `create_intent_with_card_atomic`.
      operationId: createIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntentRequest'
            examples:
              unlimitedUsageDefault:
                summary: Omit useTimes to create an unlimited intent
                value:
                  creatorId: 1
                  userId: 2
                  amount: 750.0
                  country: SA
                  city: Riyadh
                  description: Team travel allowance
                  mccList: ['4121', '7011']
                  requiredInvoiceProve: true
              explicitFiniteUsage:
                summary: Create a card with limited usage
                value:
                  creatorId: 1
                  userId: 2
                  amount: 150.0
                  useTimes: 3
                  country: UAE
                  city: Dubai
                  description: Conference meals
                  mccList: ['5812']
                  requiredInvoiceProve: false
      responses:
        '201':
          description: Intent and virtual card created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIntentResponse'
              examples:
                success:
                  value:
                    data:
                      intentId: 21
                      city: Riyadh
                      country: SA
                      description: Team travel allowance
                      mccList:
                        - code: '4121'
                          name: Taxis & Rideshare
                          group: Transport
                      requiredInvoiceProve: true
                      card:
                        id: 31
                        stripeId: ic_1234567890abcdef1234
                        createdAt: '2026-05-01T02:00:00Z'
                        status: active
                        isLockedByPendingInvoice: true
                        isManuallyFrozen: false
                        isSpendBlocked: true
                        isRequestRefund: false
                        cardNumber: '4111123412341234'
                        last4: '1234'
                        cvv: '123'
                        expiryDate: 05/29
                        expiryMonth: 5
                        expiryYear: 2029
                        cardholderName: Aisha Saleh
                        amount: 750.0
                        remainingAmount: 750.0
                        useTimes: 99999
                        usesLeft: 99999
                        unLockedAt: '2026-05-01T02:00:00Z'
                        minutesToUnlock: 0
                        hoursToUnlock: 0
                        daysToUnlock: 0
                        timeRemainingLeveled: Available Now
                        daysLocked: 0
                        creatorId: 1
                        retrieveId: 2
                        type: sent
                        senderName: null
                    message: Intent and virtual card created successfully.
                    status: 201
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /intents/{id}:
    get:
      tags: [Intents]
      summary: Get intent by id
      description: Returns a raw intent model plus the rich card response. The caller must be the creator or receiver.
      operationId: getIntentById
      parameters:
        - $ref: '#/components/parameters/IntentIdPath'
        - $ref: '#/components/parameters/ActingUserIdRequired'
      responses:
        '200':
          description: Intent fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Intent fetched successfully.
                    data:
                      intentId: 21
                      intent:
                        id: 21
                        creatorId: 1
                        receiverId: 2
                        amount: 750.0
                        remainingAmount: 750.0
                        useTimes: 99999
                        usesLeft: 99999
                        status: active
                      card:
                        id: 31
                        cardNumber: '4111123412341234'
                        cvv: '123'
                        isSpendBlocked: true
                      rich:
                        intentId: 21
                        city: Riyadh
                        country: SA
                        description: Team travel allowance
                        mccList: []
                        requiredInvoiceProve: true
                        card:
                          id: 31
                          last4: '1234'
                          useTimes: 99999
                          usesLeft: 99999
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Intents]
      summary: Patch intent metadata
      description: Updates whitelisted metadata only. Amount, remaining amount, use count, and remaining usage cannot be modified through this endpoint.
      operationId: patchIntent
      parameters:
        - $ref: '#/components/parameters/IntentIdPath'
        - $ref: '#/components/parameters/ActingUserIdRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchIntentRequest'
            examples:
              updateMetadata:
                value:
                  description: Updated travel allowance
                  city: Jeddah
                  country: SA
                  mccList: ['4121', '5812']
                  requiredInvoiceProve: false
      responses:
        '200':
          description: Intent updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDetailEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Intent updated successfully.
                    data:
                      intentId: 21
                      rich:
                        intentId: 21
                        city: Jeddah
                        country: SA
                        description: Updated travel allowance
                        mccList:
                          - code: '4121'
                            name: Taxis & Rideshare
                            group: Transport
                        requiredInvoiceProve: false
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}:
    get:
      tags: [Cards]
      summary: Get card with audit logs
      description: Returns a rich card response and audit logs for a single card. The caller must be the creator or receiver.
      operationId: getCardWithLogs
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
        - name: profileId
          in: query
          required: true
          description: Caller profile id. Must be a positive integer and must belong to the card creator or receiver.
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 1
      responses:
        '200':
          description: Card fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardWithLogsEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Card fetched successfully.
                    data:
                      card:
                        intentId: 21
                        city: Riyadh
                        country: SA
                        mccList: []
                        requiredInvoiceProve: true
                        card:
                          id: 31
                          cardNumber: '4111123412341234'
                          last4: '1234'
                          cvv: '123'
                          useTimes: 99999
                          usesLeft: 99999
                          isSpendBlocked: true
                      logs: []
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}/logs:
    get:
      tags: [Cards]
      summary: Get card audit logs
      description: Returns paged audit logs for a card with optional decision and date filters.
      operationId: getAuditLogsByCardId
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
        - $ref: '#/components/parameters/ActingUserIdRequired'
        - $ref: '#/components/parameters/LimitOptional'
        - $ref: '#/components/parameters/OffsetOptional'
        - name: decision
          in: query
          required: false
          description: Optional audit decision filter.
          schema:
            $ref: '#/components/schemas/DecisionStatus'
          example: approved
        - name: from
          in: query
          required: false
          description: Inclusive created-at lower bound.
          schema:
            type: string
            format: date-time
          example: '2026-05-01T00:00:00Z'
        - name: to
          in: query
          required: false
          description: Inclusive created-at upper bound.
          schema:
            type: string
            format: date-time
          example: '2026-05-02T00:00:00Z'
      responses:
        '200':
          description: Audit logs fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAuditLogsEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Audit logs fetched successfully.
                    data:
                      cardId: 31
                      total: 1
                      limit: 20
                      offset: 0
                      logs:
                        - id: 90
                          cardId: 31
                          transactionAmount: 25.5
                          merchantName: Riyadh Taxi
                          mcc: '4121'
                          decision: approved
                          reason: null
                          createdAt: '2026-05-01T02:00:00Z'
                          city: Riyadh
                          entityId: 21
                          action: authorization
                          occurredAt: '2026-05-01T02:00:00Z'
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}/lock-state:
    post:
      tags: [Cards]
      summary: Set card manual freeze state
      description: Toggles manual freeze only. This endpoint does not change invoice-pending lock state.
      operationId: setCardLockState
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCardLockRequest'
            examples:
              freeze:
                value:
                  locked: true
                  actingUserId: 1
              unfreeze:
                value:
                  locked: false
                  actingUserId: 1
      responses:
        '200':
          description: Card manual freeze state updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardManualFreezeEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Card manual freeze state updated successfully.
                    data:
                      cardId: 31
                      isManuallyFrozen: true
                      isLockedByPendingInvoice: false
                      isRequestRefund: false
                      isSpendBlocked: true
                      previousManualFreeze: false
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}/lifecycle-status:
    post:
      tags: [Cards]
      summary: Set virtual card lifecycle status
      description: Sets virtual_cards.status to active or inactive. Caller must be creator or receiver. SimulateTapToPay declines when status is inactive.
      operationId: setCardLifecycleStatus
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCardLifecycleStatusRequest'
            examples:
              deactivate:
                value:
                  status: inactive
                  actingUserId: 1
              activate:
                value:
                  status: active
                  actingUserId: 1
      responses:
        '200':
          description: Virtual card lifecycle status updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLifecycleStatusEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Virtual card lifecycle status updated successfully.
                    data:
                      cardId: 31
                      status: inactive
                      previousStatus: active
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/{cardId}/request-refund:
    post:
      tags: [Cards]
      summary: Record refund request on card
      description: Sets is_request_refund on the virtual card (idempotent). Caller must be creator or receiver. Response contains no card payload.
      operationId: requestCardRefund
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestRefundBody'
            examples:
              default:
                value:
                  actingUserId: 1
      responses:
        '200':
          description: Refund request recorded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequestRecordedEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Refund request recorded successfully.
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/by-user/{userId}/latest:
    get:
      tags: [Cards]
      summary: Get latest card for user
      description: Returns the latest card where the user is either creator or receiver.
      operationId: getLatestCardForUser
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Latest card fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentWithCardEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Latest card fetched successfully.
                    data:
                      intentId: 21
                      city: Riyadh
                      country: SA
                      mccList: []
                      requiredInvoiceProve: false
                      card:
                        id: 31
                        cardNumber: '4111123412341234'
                        cvv: '123'
                        useTimes: 99999
                        usesLeft: 99999
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cards/by-user/{userId}:
    get:
      tags: [Cards]
      summary: Get cards for user
      description: Returns paged cards where the user is creator or receiver.
      operationId: getCardsForUser
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/LimitOptional'
        - $ref: '#/components/parameters/OffsetOptional'
      responses:
        '200':
          description: Cards fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCardsEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Cards fetched successfully.
                    data:
                      total: 1
                      limit: 10
                      offset: 0
                      items:
                        - intentId: 21
                          city: Riyadh
                          country: SA
                          mccList: []
                          requiredInvoiceProve: false
                          card:
                            id: 31
                            last4: '1234'
                            useTimes: 99999
                            usesLeft: 99999
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{userId}/dashboard/metrics:
    get:
      tags: [Users]
      summary: Get dashboard metrics
      description: Computes user dashboard aggregates across linked intents and cards.
      operationId: getDashboardMetrics
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Dashboard metrics computed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetricsEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Dashboard metrics computed successfully.
                    data:
                      userId: 1
                      totalSpentApproved: 300.0
                      totalIntentPrincipal: 2500.0
                      totalRemainingAcrossIntents: 2200.0
                      distinctIntentCount: 4
                      distinctCardCount: 4
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{userId}/activities/latest:
    get:
      tags: [Users]
      summary: Get merged user activity feed
      description: |
        Merges card-scoped `audit_logs` (authorizations, manual freeze, invoice verification, intent updates) for every virtual card where the path user is creator or receiver,
        with profile-scoped rows where `audit_logs.user_id` matches the path user (vault `balance_added`, `balance_deducted`, `wallet_credit`, and intent governance rows on the profile feed).

        Each item exposes derived `entityType` and `outcome` for UI grouping. Use query `status` to filter by normalized outcome; use `decision` for the raw audit decision enum.
      operationId: getLatestUserActivities
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/LimitOptional'
        - $ref: '#/components/parameters/OffsetOptional'
        - name: decision
          in: query
          required: false
          description: Filter by raw audit decision (`approved`, `declined`, `info`).
          schema:
            $ref: '#/components/schemas/DecisionStatus'
          example: approved
        - name: action
          in: query
          required: false
          description: Filter by audit action (e.g. `authorization`, `balance_added`, `card_manual_freeze_set`, `intent_updated`).
          schema:
            type: string
          example: authorization
        - name: entityType
          in: query
          required: false
          description: Filter by derived bucket applied in the API after fetch.
          schema:
            $ref: '#/components/schemas/ActivityEntityType'
          example: transaction
        - name: status
          in: query
          required: false
          description: Filter by normalized outcome; echoed as `filters.outcome` in the response (query name is `status`, not `outcome`).
          schema:
            $ref: '#/components/schemas/ActivityOutcome'
          example: success
        - name: cardId
          in: query
          required: false
          description: Filter by card id.
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 31
        - name: intentId
          in: query
          required: false
          description: Filter by intent id.
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 21
        - name: from
          in: query
          required: false
          description: Inclusive UTC lower bound for created time.
          schema:
            type: string
            format: date-time
          example: '2026-05-01T00:00:00Z'
        - name: to
          in: query
          required: false
          description: Inclusive UTC upper bound for created time.
          schema:
            type: string
            format: date-time
          example: '2026-05-02T00:00:00Z'
        - name: merchant
          in: query
          required: false
          description: Case-insensitive contains on merchant name; for profile-scoped rows, matches `note` or `reason`.
          schema:
            type: string
          example: Taxi
        - name: mcc
          in: query
          required: false
          description: Exact MCC filter.
          schema:
            type: string
          example: '4121'
        - name: city
          in: query
          required: false
          description: Case-insensitive contains filter for city.
          schema:
            type: string
          example: Riyadh
        - name: minAmount
          in: query
          required: false
          description: Minimum transaction amount.
          schema:
            type: number
            format: decimal
            minimum: 0
          example: 10.0
        - name: maxAmount
          in: query
          required: false
          description: Maximum transaction amount.
          schema:
            type: number
            format: decimal
            minimum: 0
          example: 100.0
        - name: role
          in: query
          required: false
          description: User role filter. Unknown values are normalized to `all`.
          schema:
            $ref: '#/components/schemas/ActivityRole'
          example: sender
        - name: includeInfo
          in: query
          required: false
          description: Whether to include informational audit rows.
          schema:
            type: boolean
            default: true
          example: true
      responses:
        '200':
          description: Latest user activities fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLatestActivitiesEnvelope'
              examples:
                success:
                  value:
                    success: true
                    message: Latest user activities fetched successfully.
                    data:
                      userId: 1
                      total: 1
                      limit: 20
                      offset: 0
                      filters:
                        decision: approved
                        action: null
                        entityType: null
                        outcome: null
                        cardId: null
                        intentId: null
                        fromUtc: null
                        toUtc: null
                        merchant: Taxi
                        mcc: null
                        city: null
                        minAmount: null
                        maxAmount: null
                        role: sender
                        includeInfo: true
                      summary:
                        approvedCount: 1
                        declinedCount: 0
                        infoCount: 0
                        approvedSpendTotal: 25.5
                        declinedAmountTotal: 0.0
                        distinctCards: 1
                        distinctIntents: 1
                      items:
                        - id: 90
                          cardId: 31
                          intentId: 21
                          action: authorization
                          decision: approved
                          reason: null
                          transactionAmount: 25.5
                          merchantName: Riyadh Taxi
                          mcc: '4121'
                          city: Riyadh
                          createdAt: '2026-05-01T02:00:00Z'
                          occurredAt: '2026-05-01T02:00:00Z'
                          creatorId: 1
                          receiverId: 2
                          role: sender
                          intentDescription: Team travel allowance
                          category: null
                          country: SA
                          intentAmount: 750.0
                          remainingAmount: 724.5
                          cardLast4: '1234'
                          cardStatus: active
                          isLockedByPendingInvoice: false
                          isManuallyFrozen: false
                          isRequestRefund: false
                          isSpendBlocked: false
                          senderName: null
                          activityType: authorization
                          title: Approved at Riyadh Taxi
                          subtitle: Team travel allowance · Riyadh · MCC 4121
                          severity: success
                          amountLabel: $25.50
                          entityType: transaction
                          outcome: success
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
