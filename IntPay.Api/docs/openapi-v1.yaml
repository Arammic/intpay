  /verify-invoice:
    post:
      tags: [Verification]
      summary: Verify invoice
      description: Verifies an invoice image against an intent and updates invoice-pending card lock state based on the verification result.
      operationId: verifyInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyInvoiceRequest'
            examples:
              verify:
                value:
                  intentId: 21
                  imageUrl: https://example.com/invoices/21.png
                  actingUserId: 2
      responses:
        '200':
          description: Invoice verification completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceVerificationEnvelope'
              examples:
                accepted:
                  value:
                    success: true
                    message: Invoice verification completed successfully.
                    data:
                      isMatch: true
                      reason: Invoice accepted.
                      isLockedByPendingInvoice: false
                      isManuallyFrozen: false
                      isRequestRefund: false
                      isSpendBlocked: false
                      cardLocked: false
                      provider: gemini
                      invoiceCity: Riyadh
                      invoiceCountry: SA
                      hasGps: false
                      gpsLatitude: null
                      gpsLongitude: null
                      metadataCity: null
                      metadataCountry: null
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /simulate/tap-to-pay:
    post:
      tags: [Simulation]
      summary: Simulate tap-to-pay
      description: Simulates a card authorization and applies governance checks for card existence, intent existence, invoice lock, manual freeze, scheduled unlock, remaining amount, usage count, and MCC restrictions.
      operationId: simulateTapToPay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TapToPayRequest'
            examples:
              taxi:
                value:
                  cardNumber: '4111123412341234'
                  amount: 25.5
                  merchantName: Riyadh Taxi
                  mcc: '4121'
                  city: Riyadh
                  country: SA
      responses:
        '200':
          description: "Tap-to-pay simulation completed successfully. Business declines are returned with HTTP 200 and `approved: false`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TapToPayEnvelope'
              examples:
                approved:
                  value:
                    success: true
                    message: Tap-to-pay simulation completed successfully.
                    data:
                      approved: true
                      reason: approved
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
                declinedByMcc:
                  value:
                    success: true
                    message: Tap-to-pay simulation completed successfully.
                    data:
                      approved: false
                      reason: 'Transaction declined: merchant category code [7994] is not allowed for this intent.'
                    meta:
                      statusCode: 200
                      version: v1
                      timestamp: '2026-05-01T02:00:00.0000000+00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    UserIdPath:
      name: userId
      in: path
      required: true
      description: User profile id.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
    ProfileIdPath:
      name: id
      in: path
      required: true
      description: Profile id.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
    IntentIdPath:
      name: id
      in: path
      required: true
      description: Intent id.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 21
    CardIdPath:
      name: cardId
      in: path
      required: true
      description: Virtual card id.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 31
    ActingUserIdRequired:
      name: actingUserId
      in: query
      required: true
      description: Temporary caller id. Must be a positive profile id and must be authorized for the resource.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
    LimitOptional:
      name: limit
      in: query
      required: false
      description: Page size. Service clamps supported typed endpoints to 1..1000. Some card endpoints fallback to 50 when empty or invalid.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 50
      example: 20
    OffsetOptional:
      name: offset
      in: query
      required: false
      description: Number of records to skip. Negative values are normalized to 0 on typed endpoints.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
      example: 0

  responses:
    BadRequest:
      description: Invalid request body, invalid query/path parameter, validation failure, or business rule error.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - $ref: '#/components/schemas/ProblemDetails'
          examples:
            error:
              value:
                success: false
                message: Invalid query parameter value.
                detail: Failed to bind parameter "Nullable<int> limit" from "abc".
            problem:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Request body is required.
    Unauthorized:
      description: Authentication is not implemented yet, but this standard response is reserved for future JWT/session authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                success: false
                message: Authentication is required.
    Forbidden:
      description: The caller id is not allowed to access the requested resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                success: false
                message: "Access denied: this resource is only available to the sender or recipient."
    NotFound:
      description: Requested profile, intent, card, or related resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                success: false
                message: Resource not found.
    BadGateway:
      description: External invoice verification service failed or returned an invalid operating state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badGateway:
              value:
                success: false
                message: Invoice verification service failed.
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            error:
              value:
                success: false
                message: Unexpected server error.

  schemas:
    DecisionStatus:
      type: string
      description: |
        Audit decision status.
        - `approved`: authorization or verification was approved.
        - `declined`: authorization or verification was declined.
        - `info`: non-financial informational event.
      enum: [approved, declined, info]
      example: approved

    ActivityRole:
      type: string
      description: |
        Activity ownership filter (normalized server-side before querying).
        - `all`: all visible activities (default for unknown values).
        - `sender`: creator-only perspective (`creator` and `sent` are treated as `sender`).
        - `receiver`: receiver-only perspective (`recipient` and `received` are treated as `receiver`).
        - `self`: creator and receiver are the same user on the card.
      enum: [all, sender, creator, sent, receiver, recipient, received, self]
      default: all
      example: sender

    ActivitySeverity:
      type: string
      description: Frontend severity derived from decision and card governance state.
      enum: [success, danger, warning, neutral]
      example: success

    ActivityEntityType:
      type: string
      description: |
        Derived classification for an activity row (API-computed).
        - `profile`: vault balance changes and similar rows tied to `audit_logs.user_id` without a card.
        - `intent`: intent-level governance events surfaced on the profile feed.
        - `virtual_card`: card-scoped non-authorization events (freeze, invoice verification, intent updates).
        - `transaction`: card authorization attempts (`action = authorization`).
      enum: [profile, intent, virtual_card, transaction]
      example: transaction

    ActivityOutcome:
      type: string
      description: |
        Normalized outcome for filtering and UI (API-computed). Query parameter name is `status`; response echoes `filters.outcome`.
        - `success`: approved authorizations and successful balance credits.
        - `failed`: declined authorizations and failed balance operations when modeled as such.
        - `info`: informational audit rows (non-spend outcomes).
      enum: [success, failed, info]
      example: success

    CardPerspectiveType:
      type: string
      description: Card `type` as returned on `IntentWithCardResponse.card` (current-user perspective).
      enum: [self, sent, receiver]
      example: sent

    ActivityItemRole:
      type: string
      description: Role of the path user for a merged activity row. `participant` is reserved for edge cases.
      enum: [sender, receiver, self, participant]
      example: sender

    RelationshipType:
      type: string
      description: Deprecated umbrella; prefer `CardPerspectiveType` for embedded cards and `ActivityItemRole` for activity items.
      enum: [self, sent, receiver, participant]
      example: sent

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          description: Always false for this error shape.
          example: false
        message:
          type: string
          description: Human-readable error message.
          example: Query parameter actingUserId is required.
        detail:
          type: string
          nullable: true
          description: Optional technical detail, especially for binding failures.
          example: Failed to bind parameter "Nullable<int> limit" from "abc".

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Request body is required.

    Meta:
      type: object
      properties:
        statusCode:
          type: integer
          example: 200
        version:
          type: string
          example: v1
        timestamp:
          type: string
          format: date-time
          example: '2026-05-01T02:00:00.0000000+00:00'

    AddFundsRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: decimal
          description: Amount to credit to the profile vault. Must be greater than zero.
          minimum: 0
          exclusiveMinimum: true
          example: 500.0

    CreateIntentRequest:
      type: object
      required: [creatorId, userId, amount]
      properties:
        creatorId:
          type: integer
          format: int32
          description: Sender profile id.
          minimum: 1
          example: 1
        userId:
          type: integer
          format: int32
          description: Receiver profile id.
          minimum: 1
          example: 2
        amount:
          type: number
          format: decimal
          description: Intent principal amount.
          minimum: 0
          exclusiveMinimum: true
          example: 750.0
        useTimes:
          type: integer
          format: int32
          nullable: true
          description: Number of times the card can be used. Defaults to the business value "unlimited" if omitted or null. The current implementation stores unlimited as numeric sentinel `99999`, so clients should display `99999` as `unlimited`.
          default: 99999
          x-business-default: unlimited
          x-display-default: unlimited
          example: 99999
        expiryDate:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry date. If omitted, the generated card response uses an expiry about three years from creation.
          example: '2029-05-01T00:00:00Z'
        country:
          type: string
          nullable: true
          description: Optional country restriction or metadata.
          example: SA
        city:
          type: string
          nullable: true
          description: Optional city restriction or metadata.
          example: Riyadh
        description:
          type: string
          nullable: true
          description: Optional intent description.
          example: Team travel allowance
        mccList:
          type: array
          nullable: true
          description: Optional allowed MCC list. Empty or null means no MCC restriction.
          items:
            type: string
          example: ['4121', '7011']
        firstDateToUser:
          type: string
          format: date-time
          nullable: true
          description: Optional scheduled unlock time for the receiver.
          example: '2026-05-02T09:00:00Z'
        requiredInvoiceProve:
          type: boolean
          nullable: true
          default: false
          description: Whether invoice proof is required for the intent.
          example: true

    PatchIntentRequest:
      type: object
      description: Whitelisted intent metadata update. Financial and usage fields cannot be patched.
      properties:
        description:
          type: string
          nullable: true
          example: Updated travel allowance
        city:
          type: string
          nullable: true
          example: Jeddah
        country:
          type: string
          nullable: true
          example: SA
        category:
          type: string
          nullable: true
          example: Travel
        mccList:
          type: array
          nullable: true
          items:
            type: string
          example: ['4121', '5812']
        requiredInvoiceProve:
          type: boolean
          nullable: true
          example: false

    SetCardLockRequest:
      type: object
      required: [locked, actingUserId]
      properties:
        locked:
          type: boolean
          description: True to manually freeze the card, false to unfreeze it.
          example: true
        actingUserId:
          type: integer
          format: int32
          description: Caller profile id. Must be creator or receiver.
          minimum: 1
          example: 1

    SetCardLifecycleStatusRequest:
      type: object
      required: [status, actingUserId]
      properties:
        status:
          type: string
          description: Stored lowercase.
          enum: [active, inactive]
          example: inactive
        actingUserId:
          type: integer
          format: int32
          description: Caller profile id. Must be creator or receiver.
          minimum: 1
          example: 1

    CardLifecycleStatusEnvelope:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Virtual card lifecycle status updated successfully.
        data:
          type: object
          required: [cardId, status, previousStatus]
          properties:
            cardId:
              type: integer
              example: 31
            status:
              type: string
              enum: [active, inactive]
              example: inactive
            previousStatus:
              type: string
              example: active
        meta:
          type: object
          properties:
            statusCode:
              type: integer
              example: 200
            version:
              type: string
              example: v1
            timestamp:
              type: string
              example: '2026-05-01T02:00:00.0000000+00:00'

    RequestRefundBody:
      type: object
      required: [actingUserId]
      properties:
        actingUserId:
          type: integer
          format: int32
          description: Caller profile id. Must be creator or receiver.
          minimum: 1
          example: 1

    RefundRequestRecordedEnvelope:
      type: object
      required: [success, message, meta]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Refund request recorded successfully.
        meta:
          type: object
          properties:
            statusCode:
              type: integer
              example: 200
            version:
              type: string
              example: v1
            timestamp:
              type: string
              example: '2026-05-01T02:00:00.0000000+00:00'

    VerifyInvoiceRequest:
      type: object
      required: [intentId, imageUrl, actingUserId]
      properties:
        intentId:
          type: integer
          format: int32
          minimum: 1
          description: Intent id to verify against.
          example: 21
        imageUrl:
          type: string
          format: uri
          description: Public or service-accessible invoice image URL.
          example: https://example.com/invoices/21.png
        actingUserId:
          type: integer
          format: int32
          minimum: 1
          description: Caller profile id. Must be creator or receiver.
