        entityType:
          type: string
          nullable: true
          enum: [profile, intent, virtual_card, transaction]
        outcome:
          type: string
          nullable: true
          enum: [success, failed, info]

    InvoiceVerificationResponse:
      type: object
      description: |
        Payload from `VerifyInvoiceAsync`. When `requiredInvoiceProve` is false on the intent, the API returns the
        `skippedVerification` branch without calling the LLM. Otherwise fields reflect verification outcome and optional geo metadata.
      properties:
        skippedVerification:
          type: boolean
          description: Present and true when invoice proof was not required.
        isMatch:
          type: boolean
          description: Whether the invoice image matched intent expectations (or true on skip branch).
        reason:
          type: string
          nullable: true
        isLockedByPendingInvoice:
          type: boolean
        isManuallyFrozen:
          type: boolean
        isRequestRefund:
          type: boolean
          description: Virtual card refund-request flag (POST request-refund).
        isSpendBlocked:
          type: boolean
        cardLocked:
          type: boolean
          description: Same as `isSpendBlocked` in current implementation.
        provider:
          type: string
          nullable: true
        invoiceCity:
          type: string
          nullable: true
        invoiceCountry:
          type: string
          nullable: true
        hasGps:
          type: boolean
          nullable: true
        gpsLatitude:
          type: number
          format: double
          nullable: true
        gpsLongitude:
          type: number
          format: double
          nullable: true
        metadataCity:
          type: string
          nullable: true
        metadataCountry:
          type: string
          nullable: true

    TapToPayResult:
      type: object
      required: [approved, reason]
      properties:
        approved:
          type: boolean
          description: Whether the simulated authorization was approved.
          example: true
        reason:
          type: string
          description: Approval marker or decline reason.
          example: approved
